---
theme: light

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: debug

totp:
  issuer: authelia.com

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    # Public whoami endpoint (no auth required)
    - domain: public.localhost
      policy: bypass

    # Protected whoami endpoint (auth required)
    - domain: protected.localhost
      policy: one_factor

    # Protected app endpoint (auth required)
    - domain: app.localhost
      policy: one_factor

session:
  name: authelia_session
  secret: unsecure_session_secret_for_testing_only_change_in_production
  expiration: 3600
  inactivity: 300
  domain: localhost

  redis:
    host: redis
    port: 6379

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
